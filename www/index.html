<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幻兽森林</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ── 初始宠物选择 ── -->
  <div id="starter-pick" class="starter-overlay" style="display:none">
    <div class="starter-title">选择你的初始宠物</div>
    <div id="starter-cards" class="starter-cards"></div>
  </div>

  <!-- ── 地图界面 ── -->
  <div id="map-view">
    <div class="hud">
      <div class="hud-title">🗺 幻兽森林</div>
      <div class="hud-right">
        出战：<span id="active-pet">🧚 小幽</span>
      </div>
    </div>

    <div class="map-bg">

      <button class="marker m-forest" style="left:28%;top:38%" data-scene="forest">
        <span class="marker-dot"></span>
        <span class="marker-label">🌲 幽暗森林</span>
      </button>
      <button class="marker m-cave" style="left:62%;top:25%" data-scene="cave">
        <span class="marker-dot"></span>
        <span class="marker-label">💎 水晶矿洞</span>
      </button>
      <button class="marker m-ruins" style="left:75%;top:65%" data-scene="ruins">
        <span class="marker-dot"></span>
        <span class="marker-label">🏛️ 古代神殿</span>
      </button>
      <button class="marker m-lake" style="left:33%;top:70%" data-scene="lake">
        <span class="marker-dot"></span>
        <span class="marker-label">🌊 月影湖泊</span>
      </button>
      <button class="marker m-volcano" style="left:78%;top:45%" data-scene="volcano">
        <span class="marker-dot"></span>
        <span class="marker-label">🌋 炎熔火山</span>
      </button>
      <button class="marker m-realm" style="left:50%;top:50%" data-scene="realm">
        <span class="marker-dot"></span>
        <span class="marker-label">🌀 幻境裂隙</span>
      </button>
    </div>

    <p class="hint">点击地图上的光点进入战斗</p>

    <div class="captured-section">
      <div class="section-label">队伍 (<span id="caught-count">1</span>/<span id="max-pets">5</span>)</div>
      <div id="captured-list" class="captured-list">
        <span class="empty-tip">还没有宠物</span>
      </div>
    </div>
    <div class="captured-section stored-section">
      <div class="section-label">寄存 (<span id="stored-count">0</span>/<span id="max-stored">10</span>)</div>
      <div id="stored-list" class="captured-list">
        <span class="empty-tip">寄存空间为空</span>
      </div>
      <div id="stored-pager" class="stored-pager"></div>
    </div>

    <button id="btn-pokedex" class="btn-pokedex">📖 图鉴 (<span id="pokedex-count">0/24</span>)</button>
    <div id="pokedex-panel" class="pokedex-panel" hidden></div>

    <!-- ── 地图道具按钮 ── -->
    <button id="btn-items" class="item-entry-btn">🎒 道具</button>
  </div>

  <!-- ── 战斗界面 ── -->
  <div id="battle-view" hidden>
    <div class="battle-scene">
      <div class="entity">
        <div class="avatar" id="player-avatar">🧙</div>
        <div class="entity-name" id="player-name">小幽</div>
        <div class="entity-stats" id="player-stats"></div>
        <div class="hp-wrap">
          <div class="hp-label">
            <span>HP</span>
            <span id="player-hp-text">35/35</span>
          </div>
          <div class="hp-track">
            <div id="player-hp-bar" class="hp-fill green" style="width:100%"></div>
          </div>
        </div>
      </div>

      <div class="vs">VS</div>

      <div class="entity">
        <div class="avatar" id="enemy-avatar">❓</div>
        <div class="entity-name" id="enemy-name">???</div>
        <div class="entity-stats" id="enemy-stats"></div>
        <div class="hp-wrap">
          <div class="hp-label">
            <span>HP</span>
            <span id="enemy-hp-text">?/?</span>
          </div>
          <div class="hp-track">
            <div id="enemy-hp-bar" class="hp-fill green" style="width:100%"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="battle-log" class="battle-log">战斗开始！</div>

    <div id="pet-switch" class="pet-switch" hidden></div>

    <div class="battle-actions">
      <button id="btn-attack" class="action-btn">
        <span class="btn-icon">⚔️</span>
        <span class="btn-text">攻击</span>
        <span class="btn-sub">物理伤害</span>
      </button>
      <button id="btn-skill" class="action-btn btn-skill">
        <span class="btn-icon">✨</span>
        <span class="btn-text">元素技</span>
        <span class="btn-sub">五行克制</span>
      </button>
      <button id="btn-run" class="action-btn btn-run">
        <span class="btn-icon">💨</span>
        <span class="btn-text">逃跑</span>
        <span class="btn-sub">返回地图</span>
      </button>
    </div>

    <div id="battle-items" class="battle-items" hidden>
      <button id="btn-items-battle" class="item-entry-btn" style="width:100%;">🎒 道具</button>
    </div>
  </div>

  <!-- ── 道具菜单 ── -->
  <div id="item-popup" class="item-popup" hidden>
    <div class="item-tabs">
      <button class="item-tab" data-tab="all">全部</button>
      <button class="item-tab" data-tab="heal">恢复</button>
      <button class="item-tab" data-tab="fight">战斗</button>
    </div>
    <div id="item-list" class="item-list"></div>
    <button id="item-popup-close" class="popup-close">✕</button>
  </div>

  <!-- ── 目标选择器 ── -->
  <div id="target-pick" class="target-pick" hidden>
    <div class="target-title">选择目标宠物</div>
    <div id="target-list" class="target-list"></div>
    <button id="target-cancel" class="popup-close">取消</button>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
