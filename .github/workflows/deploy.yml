name: Deploy Game to Pages

on:
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build and Prepare Wasm
        run: |
          # 1. 编译
          moon clean
          moon build --target wasm --release

          # 2. 自动定位 wasm 文件并拷贝到 www 目录
          WASM_FILE=$(find . -name "*.wasm" | head -n 1)

          if [ -z "$WASM_FILE" ]; then
            echo "错误: 未找到生成的 .wasm 文件！"
            exit 1
          fi

          cp "$WASM_FILE" ./www/main.wasm
          echo "已成功将 $WASM_FILE 部署至 ./www/main.wasm"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
